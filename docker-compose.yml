services:
  mysql:
    image: mysql:8.4
    container_name: order-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-order_platform}
      MYSQL_USER: ${MYSQL_USER:-order_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-order_app_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports:
      - "3307:3306"
    volumes:
      - order_platform_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  order_platform_mysql_data:
